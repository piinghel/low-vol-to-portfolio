[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "low-volatility-factor-article"
version = "0.1.0"
description = "Research code and figures for the low-volatility factor article"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9", "numpy>=2.0", "polars>=1.43"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff==0.16.0", "ty==0.0.72"]

[project.scripts]
low-vol-factor = "low_volatility_factor.run:main"

[tool.setuptools]
packages = ["low_volatility_factor"]
